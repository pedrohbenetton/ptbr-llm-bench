[project]
name = "ptbr-llm-bench"
version = "0.1.0"
description = "Benchmark escrito à mão para LLMs em PT-BR informal"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["anthropic>=0.40"]
hf = ["torch", "transformers", "peft", "bitsandbytes", "accelerate"]

[project.scripts]
ptbrbench = "ptbrbench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptbrbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
